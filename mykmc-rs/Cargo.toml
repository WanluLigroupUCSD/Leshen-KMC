[package]
name = "mykmc-rs"
version = "0.3.0"
edition = "2021"
description = "Kinetic Monte Carlo & Microkinetic Modeling for heterogeneous catalysis"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "mykmc"
path = "src/main.rs"
