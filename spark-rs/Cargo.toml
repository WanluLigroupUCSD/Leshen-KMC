[package]
name = "spark-rs"
version = "0.4.0"
edition = "2021"
description = "Kinetic Monte Carlo (lattice + off-lattice) & Microkinetic Modeling for heterogeneous catalysis"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[[bin]]
name = "spark"
path = "src/main.rs"
